name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: API and SQLite integration tests
        run: python -m unittest -v test_app
      - name: Validate Python syntax
        run: python -m compileall -q app.py scripts test_app.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application and demo JavaScript
        run: |
          node --check static/app.js
          node --check static/login.js
          node --check docs/demo/app.js
      - name: Verify demo export
        run: python scripts/build_demo.py
